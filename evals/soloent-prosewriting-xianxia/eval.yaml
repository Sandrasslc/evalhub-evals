id: soloent-prosewriting-xianxia
protocol_revision: 1
name: SoloEnt 仙侠首章正文盲评
category: useful
description: >-
  这套评测把同一份暗黑西游仙侠项目设定与第一章章纲交给参评模型，各自独立写 3 篇约 3000 字的开篇正文，
  再由真人评审在看不到模型身份的情况下给出总评分、网文感、人物、细节、逻辑问题与 AI 感。主成绩是评审独立填写的
  0–10 分总评分，不由五个分项加权计算；来源报告收录 10 个模型、30 篇匿名作品与 117 份有效评分。
hook_title: 同一份仙侠章纲写三遍，真人盲评谁更像成熟网文
upstream:
  repo: SoloEnt-AI/novel_benchmark
  commit: 46c5573259dd1802c808a4063899e99bd8e1f54c
  contributors: [Sandrasslc]
references:
  repository: https://github.com/SoloEnt-AI/novel_benchmark
dimensions: [语言]
interface: agent
runner: custom
custom_mode: external_workflow
scoring: custom
scored_by: author
score_policy: author_fill
baseline_policy: required
score_unit: 分（满分 10）
scoring_note: >-
  参评方必须用同一参评模型独立生成 3 篇正文；每次只提供 tasks 中逐字收录的上游题面，不共享前一次输出或评语，
  不允许人工改写正文。三篇作品去除模型身份后进入来源方的真人盲评流程。评审分别填写总评分、网文感、人物、细节、
  逻辑问题与 AI 感；主成绩只取“总评分”这一独立字段的模型均值，范围 0–10、越高越好，不由五个分项推算。
  每一评分列独立进行异常值处理：同时满足偏离该篇中位数超过 2.5×MAD 且绝对偏离超过 2 分才剔除；
  判别力不足的评审样本整批排除。仓库内转换器只核验三份 UTF-8 正文与证据指纹并输出空分结果，最终数值必须由
  评测作者按同一匿名评审流程补入；材料不足、身份泄露或协议不符时不补分。
command_template:
  argv: [node, evals/soloent-prosewriting-xianxia/pack-to-result.mjs, "{input}", --out, "{output}"]
  output: soloent-prosewriting-xianxia-result.json
trials: 3
detail_profile:
  source_kind: upstream_publication
  overview_note: >-
    协议、题面、方法和官方成绩均取自 SoloEnt-AI/novel_benchmark commit 46c55732 中 2026-08-10 发布的
    prosewriting_xianxia 报告；HTML 报告快照 sha256 为 ec1b71cc762533a4365d941a55b8e240431c016ea222bf359a97d437998497d9。
  summary:
    plain_language: >-
      十个模型拿到完全相同的仙侠项目定位和第一章章纲：主角穿越成龟丞相庶子归元，在阴冷死牢醒来，受上司刁难，
      被迫处理剧毒海蛇尸体，并在触碰鳞片时触发金手指。每个模型独立写三遍，作品只以四位编号展示给评审。
      评审既给一个独立总评分，也分别评价网文感、人物、细节、逻辑问题和 AI 感；总评分的模型均值决定榜单。
    why_it_matters: >-
      长篇网文的开篇要同时建立环境、人物处境、冲突、节奏和追读钩子。只看通顺度很难判断模型能不能按章纲落实这些要求，
      而同题三次生成可以同时观察质量与稳定性。匿名真人评审还减少了模型品牌先验对判断的影响，让结果更接近读者实际看到正文时的感受。
  method_steps:
    - title: 固定同一份项目设定与章纲
      description: >-
        所有模型都收到 tasks 中逐字收录的同一题面：项目定位、核心一句话、第一章标题、三个场景的氛围与行为约束、
        结尾触发金手指的位置，以及约 3000 字篇幅要求。
    - title: 每个模型独立生成三篇
      description: >-
        每篇从相同题面重新开始，不向模型展示其他模型或自己前一次的正文、评分和评语。来源报告共得到 30 篇匿名作品。
    - title: 四位编号匿名评审
      description: >-
        作品以四位编号呈现，评审看不到模型名称、其他人的评分或评审进度；编号与模型的映射只存在于管理端。
        每篇有 3–5 份真人测评员评分，另加 1 份内部专家评分。
    - title: 分列清洗异常评分
      description: >-
        六个评分字段逐列独立处理；单个分数只有在偏离该篇中位数超过 2.5×MAD 且绝对偏离超过 2 分时才剔除。
        对评审做内部一致性筛查，判别力不足的样本整批排除；本期排除 8 份。
    - title: 汇总总评分与解释维度
      description: >-
        每篇先汇总清洗后的评分，再按模型汇总三篇。主成绩是评审独立填写的总评分均值；网文感、人物、细节、
        逻辑质量（10−逻辑问题）和低 AI 感质量（10−AI 感）只用于解释，不参与主成绩计算。
  score_interpretation: >-
    主成绩范围 0–10，越高越好，代表三篇开篇正文经匿名真人评审后“总评分”字段的模型均值。
    它不是五维平均，也不能从五个解释维度反推。来源报告最高 6.78、最低 4.82，跨度 1.96；每个模型只有三篇，
    第一档三个模型差异不具统计显著性，因此更适合按档位而非细小名次解读。比较必须保持题面、三次独立生成、匿名方式和清洗规则一致。
  key_facts:
    - value: 10 个模型 / 30 篇正文
      label: 来源报告的参评规模
      description: 每个模型独立生成三篇同题仙侠第一章。
      source_url: https://github.com/SoloEnt-AI/novel_benchmark/blob/46c5573259dd1802c808a4063899e99bd8e1f54c/reports/prosewriting_xianxia/meta.json
    - value: 117 份
      label: 清洗后有效评分
      description: 每篇 3–5 份测评员评分，另加 1 份内部专家评分。
      source_url: https://github.com/SoloEnt-AI/novel_benchmark/blob/46c5573259dd1802c808a4063899e99bd8e1f54c/reports/prosewriting_xianxia/page.template.html
    - value: 6.78 / 10
      label: 来源榜单最高总评分
      description: Gemini 3.1 Pro 的三篇汇总总评分；来源方明确提示第一档差异不显著。
      source_url: https://github.com/SoloEnt-AI/novel_benchmark/blob/46c5573259dd1802c808a4063899e99bd8e1f54c/reports/prosewriting_xianxia/page.template.html
    - value: 2.5×MAD 且偏离超过 2 分
      label: 单列异常值剔除门槛
      description: 两个条件必须同时满足，不是任一满足即剔除。
      source_url: https://github.com/SoloEnt-AI/novel_benchmark/blob/46c5573259dd1802c808a4063899e99bd8e1f54c/reports/prosewriting_xianxia/page.template.html
    - value: 约 3000 字
      label: 单篇目标篇幅
      description: 来源报告说明有模型写到约 5500 字，篇幅偏离本身不自动换算成扣分。
      source_url: https://github.com/SoloEnt-AI/novel_benchmark/blob/46c5573259dd1802c808a4063899e99bd8e1f54c/reports/prosewriting_xianxia/page.template.html
  caveats:
    - title: 每个模型只有三篇，细小名次不稳
      description: >-
        来源报告明确指出第一档三个模型之间的差异不具统计显著性，并采用分档而非精确排名；三篇样本无法可靠估计更广泛题材或长周期写作的稳定表现。
    - title: 只覆盖仙侠开篇，不覆盖长篇兑现
      description: >-
        所有判断都基于约 3000 字的第一章，不能说明模型能否在几十万字中维持节奏、回收伏笔、完成角色弧光或保持设定一致。
    - title: AI 感主观性最强
      description: >-
        来源报告指出 AI 感评分普遍偏高且离散度大，不同评审对 AI 痕迹的理解可能不同；它是唯一会改变模型排序的解释维度，不能脱离总评分单独下结论。
    - title: 官方成绩是来源转录，不是 EvalHub 复跑
      description: >-
        published-results 转录来源报告中的总分与分项，并保留全部十行官方榜单；EvalHub 没有独立复跑或重新裁判，也不代表来源方对 EvalHub 的认证或背书。
    - title: 上游仓库没有独立许可证文件
      description: >-
        固定 commit 未包含 LICENSE，报告页还写有“未经许可不得转载或引用”。本投稿由该来源仓库的管理员 Sandrasslc 明确要求复制投稿，
        这构成本次提交授权，但不应解读为对任何第三方授予一般性再利用许可。
