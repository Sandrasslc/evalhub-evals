tasks:
  - id: dragon-palace-death-prison-chapter-one
    label: 第一章：龙宫死牢，第 9527 号狱卒
    prompt: |-
      项目定位

      《西游：龙宫葬地，苟道长生》——暗黑西游 / 稳健苟道 / 权谋算计 / 凡人流升级。

      核心一句话：「在这吃人的西游世界，我归元不求成佛作祖，只求熬死在座的各位，把你们的骨灰扬了，顺便接收你们的遗产。」

      第一章：龙宫死牢，第 9527 号狱卒

      穿越成龟丞相庶子的归元，在阴冷潮湿的死牢中醒来，面对上司蟹老三的刁难，被迫去处理一具剧毒的海蛇尸体。三个场景：

      - 死牢苏醒（压抑 / 冰冷）：墙壁渗出的不是水，是黑色的死气。要求强调「冷」「湿」「黑」，不要大段独白，通过观察环境侧面反映内心。
      - 上司刁难（冲突 / 反差）：原身自卑又自傲，穿越后却跪地求饶自称「小的」。示敌以弱，是为了更好地一击毙命。
      - 走向深渊（氛围 / 铺垫）：穿过关押疯狂犯人的走廊，抵达丁字区那具散发幽绿毒气的海蛇尸体。

      结尾钩子：指尖触碰鳞片的瞬间，一股冰冷的寒流钻入体内，脑海中响起一声如磨盘转动的轰鸣——这就是章纲要求触发金手指的位置，也是多个模型没接住的地方。

      篇幅要求 3000 字左右。有模型写到了 5,500 字。
    run_spec: |-
      同一参评模型执行三次相互独立的生成。每次只提供 prompt 全文，不提供其他运行的正文、评分、评语或模型身份提示；不进行人工续写、删改或润色。
      保存每次模型返回的完整 UTF-8 正文为单独文本文件，并计算 sha256。三次完成后按 tasks/README.md 创建提交清单，运行仓库内转换器生成空分结果。
      作品进入评审前必须替换为不泄露模型身份的随机四位编号。评测作者按 scoring_note 中相同的匿名真人评审、异常值处理和样本筛查规则补入最终总评分。
